apply plugin: 'com.android.application'

android {
    compileSdk 32
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "com.dsh.sr"
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // libsrjni.so is built by native/build.bat and dropped in here
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}
